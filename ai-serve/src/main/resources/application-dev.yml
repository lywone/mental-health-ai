# 开发环境：本机 MySQL / Redis 默认值
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mental_health?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3s

logging:
  level:
    com.mental.health: debug

# 开发环境联调开关
auth:
  dev-login-enabled: true
sms:
  echo-dev-code: true
